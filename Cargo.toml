[package]
name = "papamo-sms"
version = "0.1.14"
edition = "2024"
license = "MIT"

[[bin]]
name = "psms"
path = "src/main.rs"

[dependencies]
ring = "0.17"
semver = "1"
tempfile = "3"
aes-gcm = "0.10"
rmcp = { version = "3.11", features = ["transport-io"] }
url = "2"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.4.3"
plist = "1.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
rbdc = "4.9.11"
rbdc-pg = "4.9.13"
rbdc-mysql = "4.9.12"
rbdc-mssql = "4.9.9"
rbs = "4"
ngrok = { version = "0.19.1", default-features = false, features = ["ring"] }
hostname = "0.3"
dialoguer = "0.12"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.27.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
