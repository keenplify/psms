[package]
name = "psms-hosted"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
subtle = "2"
axum = "0.8"
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread","macros","net","sync"] }
serde = {version="1",features=["derive"]}
serde_json = "1"
uuid = {version="1",features=["v4","serde"]}
sha2 = "0.10"
base64 = "0.23"
