<!doctype html><html lang="en"><meta charset="utf-8"><title>pSMS Autofill</title>
<style>body{width:300px;padding:16px;margin:0;font:14px system-ui;color:#20232b}h1{margin:0 0 12px;font-size:20px}label{display:grid;gap:4px;margin:10px 0}input,button{font:inherit;padding:7px;border:1px solid #aeb4bd;border-radius:6px}button{cursor:pointer}#enable{margin-top:12px}p{min-height:2em;color:#475368}</style>
<h1>pSMS Autofill</h1><label>Server API address<input id="server" type="url" placeholder="http://127.0.0.1:47832/v1"></label>
<label>Browser autofill token<input id="token" type="password" autocomplete="off"></label>
<label>Actions recovery key<input id="key" type="password" autocomplete="off"></label>
<button id="connect">Connect</button> <button id="lock">Lock</button><br>
<button id="enable">Enable on this site</button><p id="status" role="status"></p>
<script src="popup.js"></script></html>
