<!doctype html><html lang="en"><meta charset="utf-8"><title>pSMS Autofill</title>
<style>[hidden]{display:none!important}#account{background:#152329;color:#caf34c;border:0;font-weight:650;width:100%;padding:11px}body{width:300px;padding:16px;margin:0;font:14px system-ui;color:#20232b}h1{margin:0 0 12px;font-size:20px}label{display:grid;gap:4px;margin:10px 0}input,button{font:inherit;padding:7px;border:1px solid #aeb4bd;border-radius:6px}button{cursor:pointer}#enable{margin-top:12px}p{min-height:2em;color:#475368}@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{background:#202329;color:#ebedf1}p{color:#bcc7d8}button,input{background:#30353d;color:#f5f6f8;border-color:#576272}}</style>
<h1>pSMS Autofill</h1><label>Archive<select id="mode"><option value="hosted">Papamo account</option><option value="custom">Local or custom server</option></select></label><button id="account">Sign in with Papamo</button><label hidden id="server-label">Server API address<input id="server" type="url" placeholder="http://127.0.0.1:47832/v1"></label>
<label class="manual" hidden>Browser autofill token<input id="token" type="password" autocomplete="off"></label>
<label class="manual" hidden>Recovery phrase or original key<input id="key" type="password" autocomplete="off"></label>
<button class="manual" hidden id="connect">Connect</button> <button id="lock">Lock</button><br>
<button id="enable">Enable on this site</button><p id="status" role="status"></p>
<script src="popup.js"></script></html>
