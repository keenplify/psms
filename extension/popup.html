<!doctype html><html lang="en"><meta charset="utf-8"><title>pSMS Autofill</title>
<style>[hidden]{display:none!important}body{width:300px;padding:16px;margin:0;font:14px system-ui;color:#20232b}h1{margin:0 0 12px;font-size:20px}label{display:grid;gap:4px;margin:10px 0}input,button{font:inherit;padding:7px;border:1px solid #aeb4bd;border-radius:6px}button{cursor:pointer}.primary{background:#152329;color:#caf34c;border:0;font-weight:650;width:100%;padding:11px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.link{background:none;border:0;padding:0;color:#2366c9;text-decoration:underline;font-size:13px}.hint{color:#475368;font-size:13px;margin:8px 0 0}#who{font-weight:650}p{color:#475368}@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{background:#202329;color:#ebedf1}p,.hint{color:#bcc7d8}button,input{background:#30353d;color:#f5f6f8;border-color:#576272}.primary{background:#152329}.link{background:none;color:#8ab4ff}}</style>
<h1>pSMS Autofill</h1>
<section id="signed-out"><p class="hint" style="margin:0 0 10px">Connect the inbox your codes arrive in:</p><div id="here" hidden><button id="local" class="primary">Connect to pSMS on this computer</button><p class="hint">pSMS asks you to allow it. No sign-in needed.</p><hr style="border:0;border-top:1px solid #576272;margin:12px 0"></div><button id="account" class="primary">Sign in with Papamo</button><p class="hint">For your papamo.dev inbox. You'll sign in and choose your recovery kit PDF once.</p><button id="self" style="width:100%;margin-top:12px">Use my own pSMS server</button><p class="hint">For pSMS on this computer or a server you run. No Papamo account needed.</p></section>
<section id="signed-in" hidden><p>Connected as <span id="who">your Papamo account</span>.</p></section>
<section id="custom" hidden><label>Server API address<input id="server" type="url" placeholder="http://127.0.0.1:47832/v1"></label>
<label>Browser autofill token<input id="token" type="password" autocomplete="off"></label>
<label>Recovery phrase or original key<input id="key" type="password" autocomplete="off"></label>
<button id="connect" class="primary">Connect</button></section>
<div id="site" hidden><div class="row"><button id="enable">Turn off on this site</button></div>
<label id="unbound-label" hidden style="display:flex;gap:6px;align-items:flex-start"><input id="unbound" type="checkbox" style="margin-top:3px"><span>Only suggest codes tagged for this site with <code>@site</code>. Otherwise any recent code can be offered here.</span></label></div>
<p id="status" role="status"></p>
<div class="row" style="justify-content:space-between"><button id="mode" class="link" hidden>Back</button><button id="lock" class="link" hidden>Disconnect</button></div>
<script src="popup.js"></script></html>
