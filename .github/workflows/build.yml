name: Native builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable test --locked --target ${{ matrix.target }}
      - run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Install GPUI Kit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan-dev
      - run: cargo +stable build --manifest-path desktop-ui/Cargo.toml --target-dir target --locked --release --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tests/smoke.py target/${{ matrix.target }}/release/psms${{ matrix.ext }}
      - run: python tests/mcp.py target/${{ matrix.target }}/release/psms${{ matrix.ext }}
      - name: Build Windows installer with NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { choco install nsis -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          $bin = (Resolve-Path target/${{ matrix.target }}/release).Path
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          & $compiler /V2 "/DBIN_DIR=$bin" "/DVERSION=$version" packaging/windows/psms.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Start-Process "$bin/psms-windows-x64-setup.exe" -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed" }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($link in @((Join-Path ([Environment]::GetFolderPath('Desktop')) 'pSMS.lnk'), (Join-Path ([Environment]::GetFolderPath('Programs')) 'Papamo SMS/pSMS.lnk'))) {
            if (!(Test-Path $link) -or !(Test-Path ($shell.CreateShortcut($link).TargetPath))) { throw "Missing working shortcut: $link" }
          }
      - name: Build Linux installers with CPack
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get install -y rpm desktop-file-utils
          desktop-file-validate packaging/linux/dev.papamo.psms.desktop packaging/linux/autostart.desktop
          bin="$PWD/target/${{ matrix.target }}/release"
          label=linux-x64
          if [[ "${{ matrix.target }}" == aarch64* ]]; then label=linux-arm64; fi
          cmake -S packaging/linux -B target/package-linux -DCMAKE_INSTALL_PREFIX=/usr -DBIN_DIR="$bin" -DLABEL="$label"
          cpack --config target/package-linux/CPackConfig.cmake -G DEB -B "$bin"
          cpack --config target/package-linux/CPackConfig.cmake -G RPM -B "$bin"
          dpkg-deb -c "$bin/psms-$label.deb" > target/psms-deb-list.txt
          grep -F 'usr/share/applications/dev.papamo.psms.desktop' target/psms-deb-list.txt
          rpm -qpl "$bin/psms-$label.rpm" | grep -Fx '/usr/share/applications/dev.papamo.psms.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: papamo-sms-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/psms${{ matrix.ext }}
            target/${{ matrix.target }}/release/psms-desktop${{ matrix.ext }}
            target/${{ matrix.target }}/release/psms-windows-x64-setup.exe
            target/${{ matrix.target }}/release/psms-linux-*.deb
            target/${{ matrix.target }}/release/psms-linux-*.rpm


# Release only after all platform builds and smoke tests pass.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - uses: dtolnay/rust-toolchain@stable
      - name: Build hosted API for regional Linux servers
        run: cargo build --release --locked --manifest-path hosted/Cargo.toml
      - name: Package native downloads
        env:
          PSMS_RELEASE_SIGNING_KEY: ${{ secrets.PSMS_RELEASE_SIGNING_KEY }}
        run: python scripts/package-release.py
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes --title "pSMS $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
  rollout:
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: production-psms-rollout
      cancel-in-progress: false
    steps:
      - name: Apply the signed release one region at a time
        env:
          SSH_KEY: ${{ secrets.PSMS_ROLLOUT_KEY }}
          HOST_KEYS: ${{ secrets.PSMS_ROLLOUT_HOST_KEYS }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rollout-key"
          printf '%s\n' "$HOST_KEYS" > "$RUNNER_TEMP/rollout-hosts"
          for host in na sg ws sa; do
            printf '%s\n' "$RELEASE_TAG" | ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/rollout-hosts" -i "$RUNNER_TEMP/rollout-key" "psms_rollout@$host.sms.papamo.dev"
            curl --fail --silent --show-error --retry 3 --max-time 10 "https://$host.sms.papamo.dev/free/v1/readyz"
          done
