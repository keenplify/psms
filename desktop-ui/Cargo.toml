[package]
name = "psms-desktop"
version = "0.1.18"
edition = "2024"
license = "MIT"

[dependencies]
plist = "1.10.4"
getrandom = "0.4.3"
ring = "0.17"
axum = "0.8.9"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
aes-gcm = "0.10"
base64 = "0.23.1"
gpui-kit = "0.11.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
hostname = "0.3"
bip39 = "3.0.0"
flate2 = "1.1.11"
pdf-writer = "0.15.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
