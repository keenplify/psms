[package]
name = "psms-desktop"
version = "0.1.21"
edition = "2024"
license = "MIT"

[dependencies]
plist = "1.10.4"
getrandom = "0.4.3"
ring = "0.17"
axum = "0.8.9"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
aes-gcm = "0.10"
base64 = "0.23.1"
gpui-kit = "0.11.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
hostname = "0.3"
bip39 = "3.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pdf-writer = "0.15.0"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSSet", "NSError", "NSObject", "NSBundle", "NSDictionary", "NSArray"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "block2", "bitflags"] }
block2 = "0.6"
core-graphics = "0.24"
core-foundation = "0.10"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
